appId: uk.co.outis.app
productName: Outis
copyright: Copyright © 2026 Alwyn Thomas
directories:
  buildResources: build
  output: dist
# Only what the app needs at runtime (production node_modules are added automatically).
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
  - resources/icon.png
  # transformers.js bundles the parts of onnxruntime-web it needs; the Node build uses onnxruntime-node.
  - '!node_modules/onnxruntime-web/**'
  # Keep only the ONNX Runtime binaries for the platform and CPU being built.
  - '!node_modules/onnxruntime-node/bin/napi-v*/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/${platform}/!(${arch})/**'
# The NER model ships next to the app, outside the asar archive.
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*'
asarUnpack:
  - resources/*.png
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  executableName: outis
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target: [dmg]
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target: [AppImage, deb]
  maintainer: Alwyn Thomas
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: alwynthomasdev
  repo: outis
  releaseType: release
