name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi

      - run: npm ci

      - name: Cache NER model
        uses: actions/cache@v6
        with:
          path: resources/models
          key: ner-model-${{ hashFiles('scripts/fetch-model.mjs') }}
      - run: npm run fetch-model

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Test the packaged app (incl. ML model and offline check)
        shell: bash
        run: OUTIS_EXE="$GITHUB_WORKSPACE/dist/win-unpacked/outis.exe" npx playwright test

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Outis ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*-setup.exe dist/*-setup.exe.blockmap dist/*-portable.exe dist/latest.yml
